name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: penge_test
          POSTGRES_PASSWORD: ci-only-disposable-database-42
          POSTGRES_DB: penge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U penge_test -d penge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://penge_test:ci-only-disposable-database-42@localhost:5432/penge_test
      APP_DATABASE_PASSWORD: ci-only-runtime-database-password-42
      RUNTIME_DATABASE_URL: postgresql://penge_runtime:ci-only-runtime-database-password-42@localhost:5432/penge_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-synthetic-authentication-context-42
      RESEND_API_KEY: ""
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: test@example.test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: "24", cache: npm}
      - name: Verify configuration-generator prerequisite
        run: python3 --version
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run typecheck
      - run: sh scripts/check-integration.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Install verified Gitleaks
        run: |
          curl --fail --location --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: GITLEAKS_BIN=/tmp/gitleaks bash scripts/scan-secrets.sh
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: python -m pip install semgrep==1.182.0
      - run: semgrep scan --config p/security-audit --config p/owasp-top-ten --exclude .next --exclude node_modules --exclude work --metrics=off --strict --error .
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: docker build --target runtime -t penge-ci .
      - run: docker build --target mail-worker -t penge-worker-ci .
      - name: Scan image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed penge-ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed penge-worker-ci
